name: Build Windows App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Prepare offline app
        shell: bash
        run: |
          mkdir -p app
          cp index.html app/index.html
          cp node_modules/xlsx/dist/xlsx.full.min.js app/xlsx.full.min.js
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js#xlsx.full.min.js#' app/index.html
          grep -c "xlsx.full.min.js" app/index.html
      - run: npx electron-builder --win portable --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: personal-info-windows
          path: dist/*.exe
